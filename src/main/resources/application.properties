spring.application.name=MurderHeCoded

simulation.default.agents=7
simulation.default.locations=8
simulation.default.items=5
simulation.default.steps=100
simulation.default.scenelength=Medium

simulation.default.title=Murder Over Mars
simulation.default.description=A classic murder mystery aboard a massive, rotating space station orbiting Mars. Trapped together in the vacuum of space are the station's crew and wealthy stakeholders invested in the new Martian mining colony below.

# Spring AI Ollama Configuration
spring.ai.ollama.base-url=http://192.168.0.169:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.enabled=false
spring.ai.ollama.chat.options.temperature=0.7

app.ollama.url=${spring.ai.ollama.base-url}

# Editorial Scoring Base Points
scorer.action.murder=10.0
scorer.action.accuse=9.5
scorer.action.search=6.5
scorer.action.talk-new-fact=5.5
scorer.action.talk-no-fact=3.5
scorer.action.manipulate=5.0
scorer.action.alter-env=4.5
scorer.action.reflect=2.5
scorer.action.default=1.0

# Suspense & Tension Rules
scorer.suspense.max=10.0
scorer.suspense.detective-present=7.5
scorer.suspense.victim-isolated=9.0
scorer.suspense.victim-present=7.5
scorer.suspense.search-multiple=6.5
scorer.suspense.hide-item=7.0
scorer.suspense.time-bonus=1.0
scorer.suspense.event-alarm=1.5
scorer.suspense.event-isolation=1.0

# Category Thresholds
scorer.category.essential=7.5
scorer.category.supporting=5.5
scorer.category.atmospheric=3.5

# Selection Thresholds
scorer.select.supporting=4.0
scorer.select.atmospheric=4.5

# LLM Scene Director
temp.director=0.35
numctx.director=8192
